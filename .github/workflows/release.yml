name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release if the version tag is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, sys

          def fail(msg):
              print(msg, file=sys.stderr)
              sys.exit(1)

          sante = Path('sante.ps1').read_bytes()
          if sante[:3] != b'\xef\xbb\xbf':
              fail('sante.ps1 doit commencer par un BOM UTF-8 ; release annulée.')
          if sante.count(b'\n') != sante.count(b'\r\n'):
              fail('sante.ps1 doit être en CRLF ; release annulée.')
          digest = hashlib.sha256(sante).hexdigest().upper()
          published = Path('sante.ps1.sha256').read_text(encoding='ascii').strip().split()[0]
          if digest != published:
              fail(f'Empreinte incohérente : fichier {digest}, publié {published}.')
          go = Path('go.ps1').read_bytes()
          if go[:3] == b'\xef\xbb\xbf':
              fail('go.ps1 ne doit pas avoir de BOM ; release annulée.')
          if digest not in go.decode('utf-8'):
              fail('go.ps1 ne contient pas l empreinte de sante.ps1 ; release annulée.')
          text = sante.decode('utf-8-sig')
          match = re.search(r"\$script:SanteVersion = '([^']+)'", text)
          if not match:
              fail('SanteVersion introuvable.')
          Path('/tmp/sante-version').write_text(match.group(1), encoding='ascii')
          print('intégrité ok', match.group(1), digest)
          PY
          ver="$(cat /tmp/sante-version)"
          tag="v${ver}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi
          notes="$(python3 -c "
          from pathlib import Path
          import sys
          tag = sys.argv[1]
          heading = '## ' + tag
          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          body = []
          in_section = False
          for line in lines:
              if line.strip() == heading:
                  in_section = True
                  continue
              if in_section and line.startswith('## '):
                  break
              if in_section:
                  body.append(line)
          text = '\n'.join(body).strip()
          if not text:
              text = 'Santé PC ' + tag
          print(text)
          " "$tag")"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$notes"

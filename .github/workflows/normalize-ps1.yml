name: normalize-ps1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore UTF-8 BOM and CRLF, then retarget the version release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, sys

          def to_crlf(text: str) -> str:
              return text.replace('\r\n', '\n').replace('\n', '\r\n')

          def write_ps1(path: str, bom: bool) -> bool:
              p = Path(path)
              data = p.read_bytes()
              text = to_crlf(data.decode('utf-8-sig'))
              out = text.encode('utf-8')
              if bom:
                  out = b'\xef\xbb\xbf' + out
              if data != out:
                  p.write_bytes(out)
                  return True
              return False

          changed = False
          changed |= write_ps1('sante.ps1', True)
          changed |= write_ps1('tests/sante.Tests.ps1', True)
          changed |= write_ps1('go.ps1', False)

          sante = Path('sante.ps1').read_bytes()
          digest = hashlib.sha256(sante).hexdigest().upper()
          sha_path = Path('sante.ps1.sha256')
          expected_line = digest + '  sante.ps1\n'
          if sha_path.read_bytes() != expected_line.encode('ascii'):
              sha_path.write_bytes(expected_line.encode('ascii'))
              changed = True

          go_path = Path('go.ps1')
          go_text = go_path.read_bytes().decode('utf-8-sig')
          go_new, n = re.subn(r"\$attendu = '[0-9A-F]{64}'", f"$attendu = '{digest}'", go_text, count=1)
          if n != 1:
              raise SystemExit('Impossible de mettre à jour $attendu dans go.ps1.')
          go_out = to_crlf(go_new).encode('utf-8')
          if go_path.read_bytes() != go_out:
              go_path.write_bytes(go_out)
              changed = True

          text = sante.decode('utf-8-sig')
          match = re.search(r"\$script:SanteVersion = '([^']+)'", text)
          if not match:
              raise SystemExit('SanteVersion introuvable.')
          Path('/tmp/sante-version').write_text(match.group(1), encoding='ascii')
          Path('/tmp/sante-changed').write_text('1' if changed else '0', encoding='ascii')
          print('changed', changed, 'version', match.group(1), 'sha256', digest)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(cat /tmp/sante-changed)" = "1" ]; then
            git add -- sante.ps1 go.ps1 sante.ps1.sha256 tests/sante.Tests.ps1
            git commit -m "Rétablit le BOM UTF-8 et les fins de ligne CRLF."
            git push
          else
            echo "Encodages déjà conformes."
          fi

          ver="$(cat /tmp/sante-version)"
          tag="v${ver}"
          sha="$(git rev-parse HEAD)"
          notes="$(python3 -c "
          from pathlib import Path
          import sys
          tag = sys.argv[1]
          heading = '## ' + tag
          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          body = []
          in_section = False
          for line in lines:
              if line.strip() == heading:
                  in_section = True
                  continue
              if in_section and line.startswith('## '):
                  break
              if in_section:
                  body.append(line)
          text = '\n'.join(body).strip()
          if not text:
              text = 'Santé PC ' + tag
          print(text)
          " "$tag")"

          current=""
          if gh release view "$tag" >/dev/null 2>&1; then
            current="$(gh release view "$tag" --json targetCommitish,tagName --jq .targetCommitish)"
            # targetCommitish may be a branch name; compare the tag SHA
            tagsha="$(git rev-list -n 1 "refs/tags/${tag}" 2>/dev/null || true)"
            if [ -z "$tagsha" ]; then
              tagsha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha)"
            fi
            if [ "$tagsha" = "$sha" ]; then
              echo "Release ${tag} already points at ${sha}"
              exit 0
            fi
            echo "Retargeting ${tag} from ${tagsha} to ${sha}"
            gh release delete "$tag" --yes --cleanup-tag
            git push origin ":refs/tags/${tag}" || true
          fi
          gh release create "$tag" --target "$sha" --title "$tag" --notes "$notes"

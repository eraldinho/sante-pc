name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4

      - name: Modules
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -MinimumVersion 1.21.0 -Scope CurrentUser -Force -AllowClobber
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck

      - name: ScriptAnalyzer
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer
          $resultats = @(Invoke-ScriptAnalyzer -Path .\sante.ps1 -Severity Error)
          $resultats | Format-Table -AutoSize | Out-String | Write-Host
          if ($resultats.Count -gt 0) { throw 'PSScriptAnalyzer a signalé des erreurs.' }

      - name: Pester
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          Invoke-Pester -Path .\tests -CI

      - name: Passe rapide
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $chrono = [Diagnostics.Stopwatch]::StartNew()
          & .\sante.ps1
          $chrono.Stop()
          if ($chrono.Elapsed.TotalSeconds -ge 60) {
            throw ('Passe rapide trop longue : ' + [string]$chrono.Elapsed.TotalSeconds + ' s')
          }
